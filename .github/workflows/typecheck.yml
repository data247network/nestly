name: TypeScript check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dependency installation + tsc is intentionally independent of Supabase
# runtime credentials; it validates the application source without secrets.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
