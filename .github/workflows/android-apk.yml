name: Android APK build

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    # The publish commit contains only the already-built APK/manifest and uses
    # [skip ci], so it must not start another Android build.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Publish Nestly APK')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run cap:build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Configure Nestly release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NESTLY_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NESTLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESTLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing NESTLY_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing NESTLY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing NESTLY_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing NESTLY_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/nestly-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=nestly-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/nestly-release.jks android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for release APKs..."
          find android/app/build/outputs -type f -name '*.apk' -print -exec ls -lh {} \;
          apk_count=$(find android/app/build/outputs -type f -name '*.apk' | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          if [ "$apk_count" -gt 1 ]; then
            echo "ERROR: Multiple APKs were produced; refusing to upload an ambiguous build."
            exit 1
          fi
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          echo "APK found: $apk"
          echo "APK size:"
          ls -lh "$apk"
          echo "APK SHA-256:"
          sha256sum "$apk"
          echo "APK signing information:"
          apksigner verify --verbose "$apk"

          expected_code=$(awk '/versionCode[[:space:]]+[0-9]+/ { print $2; exit }' android/app/build.gradle)
          expected_name=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          actual_code=$(aapt dump badging "$apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          actual_name=$(aapt dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "Gradle version: $expected_code ($expected_name)"
          echo "APK version:    $actual_code ($actual_name)"
          test "$expected_code" = "$actual_code" || { echo "ERROR: APK versionCode does not match build.gradle"; exit 1; }
          test "$expected_name" = "$actual_name" || { echo "ERROR: APK versionName does not match build.gradle"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestly-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish signed APK to portal
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          mkdir -p public/downloads
          cp "$apk" public/downloads/nestly.apk

          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')
          const { execFileSync } = require('node:child_process')

          const gradle = readFileSync('android/app/build.gradle', 'utf8')
          const versionCode = Number(/versionCode\s+(\d+)/.exec(gradle)?.[1])
          const versionName = /versionName\s+"([^"]+)"/.exec(gradle)?.[1]
          if (!Number.isInteger(versionCode) || !versionName) throw new Error('Could not read Android version')

          const apk = readFileSync('public/downloads/nestly.apk')
          const sha256 = createHash('sha256').update(apk).digest('hex')
          const size = apk.length
          const actualCode = execFileSync('aapt', ['dump', 'badging', 'public/downloads/nestly.apk'], { encoding: 'utf8' })
            .match(/versionCode='([^']+)'/)?.[1]
          const actualName = execFileSync('aapt', ['dump', 'badging', 'public/downloads/nestly.apk'], { encoding: 'utf8' })
            .match(/versionName='([^']+)'/)?.[1]
          if (String(versionCode) !== actualCode || versionName !== actualName) {
            throw new Error(`APK version ${actualCode}/${actualName} does not match Gradle ${versionCode}/${versionName}`)
          }

          const manifest = {
            versionCode,
            versionName,
            url: 'https://nestly-gamma-seven.vercel.app/downloads/nestly.apk',
            sha256,
            size,
            notes: 'Improved child cloud sync and automatic update notices.',
            publishedAt: new Date().toISOString(),
          }
          writeFileSync('public/downloads/latest.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log(JSON.stringify(manifest, null, 2))
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/nestly.apk public/downloads/latest.json
          if git diff --cached --quiet; then
            echo "Published APK is already identical; nothing to commit."
            exit 0
          fi
          git commit -m "Publish Nestly APK ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Remove signing material
        if: always()
        run: rm -f android/nestly-release.jks android/keystore.properties
