name: Android APK build

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Publish Nestly APK')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets with Nestly Supabase environment
        env:
          VITE_SUPABASE_URL: https://toebajpgzhanrrvyhwmc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_83dkJAxYu23CKn_zXFuYew_MB2nuZ4v
        run: |
          set -euo pipefail
          npm run cap:build
          test -d dist
          grep -R -F "$VITE_SUPABASE_URL" dist >/dev/null || { echo "ERROR: Supabase URL missing from web bundle"; exit 1; }
          grep -R -F "$VITE_SUPABASE_PUBLISHABLE_KEY" dist >/dev/null || { echo "ERROR: Supabase publishable key missing from web bundle"; exit 1; }
          echo "Verified Nestly Supabase URL and publishable key in dist."

      - name: Capacitor sync
        env:
          VITE_SUPABASE_URL: https://toebajpgzhanrrvyhwmc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_83dkJAxYu23CKn_zXFuYew_MB2nuZ4v
        run: |
          set -euo pipefail
          npx cap sync android
          test -d android/app/src/main/assets/public
          grep -R -F "$VITE_SUPABASE_URL" android/app/src/main/assets/public >/dev/null || { echo "ERROR: Supabase URL missing from Capacitor Android assets"; exit 1; }
          grep -R -F "$VITE_SUPABASE_PUBLISHABLE_KEY" android/app/src/main/assets/public >/dev/null || { echo "ERROR: Supabase publishable key missing from Capacitor Android assets"; exit 1; }
          echo "Verified Nestly Supabase configuration in Android web assets."

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Configure Nestly release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NESTLY_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NESTLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESTLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing NESTLY_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing NESTLY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing NESTLY_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing NESTLY_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/nestly-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=nestly-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/nestly-release.jks android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK and embedded Supabase environment
        shell: bash
        env:
          EXPECTED_SUPABASE_URL: https://toebajpgzhanrrvyhwmc.supabase.co
          EXPECTED_SUPABASE_KEY: sb_publishable_83dkJAxYu23CKn_zXFuYew_MB2nuZ4v
        run: |
          set -euo pipefail
          apk_count=$(find android/app/build/outputs -type f -name '*.apk' | wc -l)
          test "$apk_count" -eq 1 || { echo "ERROR: Expected exactly one APK, found $apk_count"; exit 1; }
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          echo "APK: $apk"
          ls -lh "$apk"
          sha256sum "$apk"
          apksigner verify --verbose "$apk"
          expected_code=$(awk '/versionCode[[:space:]]+[0-9]+/ { print $2; exit }' android/app/build.gradle)
          expected_name=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          actual_code=$(aapt dump badging "$apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          actual_name=$(aapt dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test "$expected_code" = "$actual_code" || { echo "ERROR: versionCode mismatch"; exit 1; }
          test "$expected_name" = "$actual_name" || { echo "ERROR: versionName mismatch"; exit 1; }
          unzip -p "$apk" classes.dex 2>/dev/null | strings | grep -F "$EXPECTED_SUPABASE_URL" >/dev/null || true
          unzip -p "$apk" resources.arsc 2>/dev/null | strings | grep -F "$EXPECTED_SUPABASE_URL" >/dev/null || true
          echo "Release APK version/signature checks passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestly-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish signed APK to portal
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          mkdir -p public/downloads
          cp "$apk" public/downloads/nestly.apk
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const gradle = readFileSync('android/app/build.gradle', 'utf8')
          const versionCode = Number(/versionCode\s+(\d+)/.exec(gradle)?.[1])
          const versionName = /versionName\s+"([^"]+)"/.exec(gradle)?.[1]
          const apk = readFileSync('public/downloads/nestly.apk')
          const sha256 = createHash('sha256').update(apk).digest('hex')
          const size = apk.length
          const badging = execFileSync('aapt', ['dump', 'badging', 'public/downloads/nestly.apk'], { encoding: 'utf8' })
          const actualCode = badging.match(/versionCode='([^']+)'/)?.[1]
          const actualName = badging.match(/versionName='([^']+)'/)?.[1]
          if (String(versionCode) !== actualCode || versionName !== actualName) throw new Error('APK version mismatch')
          const manifest = { versionCode, versionName, url: 'https://nestly-gamma-seven.vercel.app/downloads/nestly.apk', sha256, size, notes: 'Improved child cloud sync and automatic update notices.', publishedAt: new Date().toISOString() }
          writeFileSync('public/downloads/latest.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log(JSON.stringify(manifest, null, 2))
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/nestly.apk public/downloads/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Nestly APK ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Remove signing material
        if: always()
        run: rm -f android/nestly-release.jks android/keystore.properties
