name: Android APK build

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run cap:build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Configure Nestly release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NESTLY_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NESTLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESTLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing NESTLY_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing NESTLY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing NESTLY_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing NESTLY_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/nestly-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=nestly-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/nestly-release.jks android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for release APKs..."
          find android/app/build/outputs -type f -name '*.apk' -print -exec ls -lh {} \;
          apk_count=$(find android/app/build/outputs -type f -name '*.apk' | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          if [ "$apk_count" -gt 1 ]; then
            echo "ERROR: Multiple APKs were produced; refusing to upload an ambiguous build."
            exit 1
          fi
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          echo "APK found: $apk"
          echo "APK size:"
          ls -lh "$apk"
          echo "APK SHA-256:"
          sha256sum "$apk"
          echo "APK signing information:"
          apksigner verify --verbose "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestly-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f android/nestly-release.jks android/keystore.properties
