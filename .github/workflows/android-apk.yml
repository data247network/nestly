name: Android APK build

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run cap:build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for release APKs..."
          find android/app/build/outputs -type f -name '*.apk' -print -exec ls -lh {} \;
          apk_count=$(find android/app/build/outputs -type f -name '*.apk' | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          if [ "$apk_count" -gt 1 ]; then
            echo "ERROR: Multiple APKs were produced; refusing to upload an ambiguous build."
            exit 1
          fi
          apk=$(find android/app/build/outputs -type f -name '*.apk' -print -quit)
          echo "APK found: $apk"
          echo "APK size:"
          ls -lh "$apk"
          echo "APK SHA-256:"
          sha256sum "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestly-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
